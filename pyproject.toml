[project]
name = "clash-copilot"
version = "0.1.0"
description = "Computer-vision study project: track an opponent's card plays, hand cycle, and elixir from Clash Royale replay footage."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "opencv-python>=4.9",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
ml = ["torch>=2.3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/clash_copilot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
